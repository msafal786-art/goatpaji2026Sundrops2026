<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dispatch Portal — GOAT INC</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dispatch" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #0e0e10; color: #f2f2f7; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      html { scroll-behavior: smooth; }

      /* Refined scrollbars — thin, unobtrusive, brighter on hover */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(120,120,128,0.4);
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(120,120,128,0.65); background-clip: padding-box; }
      * { scrollbar-width: thin; scrollbar-color: rgba(120,120,128,0.4) transparent; }

      input, select, textarea, button { font-family: inherit; }
      select option { background: #252528; color: #f2f2f7; }

      /* Text selection uses the app's blue accent */
      ::selection { background: rgba(10,132,255,0.30); }

      /* Remove the grey mobile tap flash; we provide our own press feedback */
      * { -webkit-tap-highlight-color: transparent; }

      /* Smooth, tactile interactions app-wide. Only paint/transform properties
         are transitioned, so nothing here can shift layout. */
      button, a, [role="button"] {
        transition: background-color .15s ease, border-color .15s ease,
                    box-shadow .15s ease, transform .12s ease, opacity .15s ease, color .15s ease;
      }
      button:not(:disabled):active,
      [role="button"]:active { transform: translateY(1px); }
      button:disabled { cursor: not-allowed; opacity: .5; }

      input, select, textarea {
        transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
      }
      /* Focus glow on fields — box-shadow ring layers over the inline border
         without overriding it, so it works regardless of each field's own style */
      input:focus, select:focus, textarea:focus {
        box-shadow: 0 0 0 3px rgba(10,132,255,0.22);
      }

      /* Keyboard focus ring for everything else — only shows for keyboard nav,
         never on mouse click, so it adds accessibility without visual noise */
      :focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(10,132,255,0.35); }

      /* Mobile "More" sheet entrance */
      @keyframes sheetFade { from { opacity: 0 } to { opacity: 1 } }
      @keyframes sheetUp { from { transform: translateY(100%) } to { transform: translateY(0) } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
